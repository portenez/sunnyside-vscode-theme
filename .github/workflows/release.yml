name: Prepare or publish release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Marketplace (leave false to test packaging)
        type: boolean
        default: false
      version:
        description: Exact package.json version to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Check requested version and release readiness
        run: node scripts/check-release.js
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUIRE_RELEASE_READY: ${{ inputs.publish }}
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-vsix
          path: dist/*.vsix
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-vsix
          path: dist
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Publish the tested package
        run: npx --no-install vsce publish --azure-credential --packagePath dist/*.vsix
