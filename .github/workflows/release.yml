name: Prepare or publish release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Marketplace (leave false to test packaging)
        type: boolean
        default: false
      version:
        description: Exact package.json version to release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: marketplace-release
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit
      - name: Check requested version and release readiness
        run: node scripts/check-release.js
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REQUIRE_RELEASE_READY: ${{ inputs.publish }}
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: dist/*.vsix
          if-no-files-found: error
  publish:
    if: inputs.publish
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: dist
      - name: Publish the tested package
        run: npx --no-install vsce publish --oidc --packagePath dist/*.vsix
